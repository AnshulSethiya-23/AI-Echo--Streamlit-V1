# =============================================================================
# BROOKFIELD DASHBOARD V2 — SQL MAPPING CONFIG
# =============================================================================
# project  = funnel-data          (set in .env as GCP_PROJECT_ID)
# dataset  = brookfield_dashboard  (set in .env as BQ_DATASET)
#
# Real tables:
#   Brookfield_1H_Executive_Summary_   — all channels combined
#   Brookfield_1H_Search               — Google Ads + Bing
#   Brookfield_1H_Social               — Meta + LinkedIn
#   Brookfield_1H_Programmatic         — DV360 programmatic
#
# Column notes:
#   Date column  → Date  (DATETIME — always wrap in DATE())
#   Cost column  → Cost  (aliased as "spend" in queries below)
#
# chart_type values:
#   scorecard   → st.metric KPI card
#   line        → Plotly Scatter (lines+markers)
#   area        → Plotly Scatter (fill to zero)
#   bar         → Plotly Bar (grouped)
#   grouped_bar → alias for bar
#   stacked_bar → Plotly Bar (stacked)
#   pie         → Plotly Pie / donut
#   table       → st.dataframe summary table
# =============================================================================

charts:

  # ============================================================================
  # EXECUTIVE SUMMARY
  # ============================================================================

  # ── Scorecards ───────────────────────────────────────────────────────────────

  - id: exec_total_impressions
    tab: exec_summary
    title: "Total Impressions"
    chart_type: scorecard
    metric_col: impressions
    sql: |
      SELECT SUM(Impressions) AS impressions
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'

  - id: exec_total_clicks
    tab: exec_summary
    title: "Total Clicks"
    chart_type: scorecard
    metric_col: clicks
    sql: |
      SELECT SUM(Clicks) AS clicks
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'

  - id: exec_total_spend
    tab: exec_summary
    title: "Total Spend"
    chart_type: scorecard
    metric_col: spend
    format: currency
    sql: |
      SELECT ROUND(SUM(Cost), 2) AS spend
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'

  - id: exec_overall_ctr
    tab: exec_summary
    title: "Overall CTR"
    chart_type: scorecard
    metric_col: ctr
    format: percent
    sql: |
      SELECT ROUND(SAFE_DIVIDE(SUM(Clicks), SUM(Impressions)) * 100, 2) AS ctr
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'

  - id: exec_avg_cpc
    tab: exec_summary
    title: "Avg CPC"
    chart_type: scorecard
    metric_col: avg_cpc
    format: currency
    sql: |
      SELECT ROUND(SAFE_DIVIDE(SUM(Cost), SUM(Clicks)), 2) AS avg_cpc
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'

  # ── Trend charts ─────────────────────────────────────────────────────────────

  - id: exec_impressions_trend
    tab: exec_summary
    title: "Impressions Trend (All Channels)"
    chart_type: line
    x_col: date
    y_cols: [impressions]
    sql: |
      SELECT
        DATE(Date) AS date,
        SUM(Impressions) AS impressions
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
      GROUP BY DATE(Date)
      ORDER BY date

  - id: exec_spend_trend
    tab: exec_summary
    title: "Spend Over Time"
    chart_type: area
    x_col: date
    y_cols: [spend]
    sql: |
      SELECT
        DATE(Date) AS date,
        ROUND(SUM(Cost), 2) AS spend
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
      GROUP BY DATE(Date)
      ORDER BY date

  - id: exec_ctr_trend
    tab: exec_summary
    title: "CTR Trend (All Channels)"
    chart_type: line
    x_col: date
    y_cols: [ctr]
    sql: |
      SELECT
        DATE(Date) AS date,
        ROUND(SAFE_DIVIDE(SUM(Clicks), SUM(Impressions)) * 100, 2) AS ctr
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
      GROUP BY DATE(Date)
      ORDER BY date

  - id: exec_clicks_trend
    tab: exec_summary
    title: "Clicks Trend (All Channels)"
    chart_type: line
    x_col: date
    y_cols: [clicks]
    sql: |
      SELECT
        DATE(Date) AS date,
        SUM(Clicks) AS clicks
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
      GROUP BY DATE(Date)
      ORDER BY date

  # ── Distribution charts ───────────────────────────────────────────────────────

  - id: exec_spend_by_channel
    tab: exec_summary
    title: "Spend by Channel"
    chart_type: pie
    label_col: channel
    value_col: spend
    sql: |
      SELECT
        Channel AS channel,
        ROUND(SUM(Cost), 2) AS spend
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
      GROUP BY Channel
      ORDER BY spend DESC

  - id: exec_clicks_by_channel
    tab: exec_summary
    title: "Clicks by Channel"
    chart_type: bar
    x_col: channel
    y_cols: [clicks]
    sql: |
      SELECT
        Channel AS channel,
        SUM(Clicks) AS clicks
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
      GROUP BY Channel
      ORDER BY clicks DESC

  # ── Multi-metric trend (for interactive dual-axis chart) ─────────────────────

  - id: exec_multi_metric_trend
    tab: exec_summary
    title: "Multi-Metric Trend"
    chart_type: _internal
    x_col: date
    sql: |
      SELECT
        DATE(Date) AS date,
        ROUND(SUM(Cost), 2)                                                AS spend,
        SUM(Clicks)                                                         AS clicks,
        SUM(Impressions)                                                    AS impressions,
        ROUND(SAFE_DIVIDE(SUM(Clicks), SUM(Impressions)) * 100, 4)         AS ctr,
        ROUND(SAFE_DIVIDE(SUM(Cost), SUM(Clicks)), 4)                      AS cpc,
        ROUND(SAFE_DIVIDE(SUM(Cost), SUM(Impressions)) * 1000, 4)          AS cpm
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
      GROUP BY DATE(Date)
      ORDER BY date

  # ── Summary table ─────────────────────────────────────────────────────────────

  - id: exec_channel_table
    tab: exec_summary
    title: "Performance by Channel"
    chart_type: table
    column_formats:
      spend: currency
      ctr: percent
      cpc: currency
      impressions: number
      clicks: number
    sql: |
      SELECT
        Channel AS channel,
        SUM(Impressions) AS impressions,
        SUM(Clicks) AS clicks,
        ROUND(SUM(Cost), 2) AS spend,
        ROUND(SAFE_DIVIDE(SUM(Clicks), SUM(Impressions)) * 100, 2) AS ctr,
        ROUND(SAFE_DIVIDE(SUM(Cost), SUM(Clicks)), 2) AS cpc
      FROM `{project}.{dataset}.Brookfield_1H_Executive_Summary_`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
      GROUP BY Channel
      ORDER BY spend DESC

  - id: exec_campaign_table
    tab: exec_summary
    title: "Campaign Performance (All Channels)"
    chart_type: table
    column_formats:
      spend: currency
      ctr: percent
      avg_cpc: currency
      impressions: number
      clicks: number
    sql: |
      SELECT
        'Search' AS channel,
        Campaign_New AS campaign,
        SUM(Impressions) AS impressions,
        SUM(Clicks) AS clicks,
        ROUND(SUM(Cost), 2) AS spend,
        ROUND(SAFE_DIVIDE(SUM(Clicks), SUM(Impressions)) * 100, 2) AS ctr,
        ROUND(SAFE_DIVIDE(SUM(Cost), SUM(Clicks)), 2) AS avg_cpc
      FROM `{project}.{dataset}.Brookfield_1H_Search`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
        AND Data_Source_name IN (
          '2026 - Corporate Brand Campaign - Keyword',
          'Brookfield Brand Campaign - Search keyword'
        )
      GROUP BY Campaign_New
      UNION ALL
      SELECT
        'Social' AS channel,
        Data_Source_name AS campaign,
        SUM(Impressions) AS impressions,
        SUM(Clicks) AS clicks,
        ROUND(SUM(Cost), 2) AS spend,
        ROUND(SAFE_DIVIDE(SUM(Clicks), SUM(Impressions)) * 100, 2) AS ctr,
        ROUND(SAFE_DIVIDE(SUM(Cost), SUM(Clicks)), 2) AS avg_cpc
      FROM `{project}.{dataset}.Brookfield_1H_Social`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
        AND Data_Source_name IN (
          'Brookfield Brand Campaign - Standard',
          'Brookfield - Ad Account - Campaign'
        )
      GROUP BY Data_Source_name
      ORDER BY spend DESC
      LIMIT 30


