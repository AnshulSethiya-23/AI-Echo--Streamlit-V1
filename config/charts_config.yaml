  # ── Summary table ─────────────────────────────────────────────────────────────

  - id: prog_channel_table
    tab: programmatic
    title: "Channel Performance Summary"
    chart_type: table
    column_formats:
      spend: currency
      avg_cpm: currency
      avg_cpv: currency
      impressions: number
      clicks: number
      video_views: number
    sql: |
      SELECT
        Channels_DV360 AS channel,
        SUM(Impressions) AS impressions,
        SUM(Clicks) AS clicks,
        ROUND(SUM(Cost), 2) AS spend,
        ROUND(SAFE_DIVIDE(SUM(Cost), SUM(Impressions)) * 1000, 2) AS avg_cpm,
        SUM(Video_Completed_Views__Display__Video_360) AS video_views,
        ROUND(
          SAFE_DIVIDE(SUM(Cost), SUM(Video_Completed_Views__Display__Video_360)), 2
        ) AS avg_cpv
      FROM `{project}.{dataset}.Brookfield_1H_Programmatic`
      WHERE DATE(Date) BETWEEN '{start_date}' AND '{end_date}'
        AND Data_Source = 'doubleclick_bidmanager_api:e6b3648e-2446-48ae-9031-9316e1113d86'
      GROUP BY Channels_DV360
      ORDER BY spend DESC
